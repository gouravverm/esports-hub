# Every 30 minutes: update the Liquipedia data, build the web app, publish both to GitHub Pages.
# The database (page cache + parsed data) is kept between runs in the Actions cache, so each run
# only downloads pages that changed. The very first run starts from the "db-seed" release.
name: Collect and deploy

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write   # the next-run job starts the following run
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install collector dependency
        run: pip install mwparserfromhell==0.7.2

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/esports.db
          key: esports-db-${{ github.run_id }}
          restore-keys: esports-db-

      - name: Seed database on the first run
        if: hashFiles('data/esports.db') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download db-seed --pattern esports.db --dir data || echo "no seed, starting empty"

      - name: Collect from Liquipedia
        working-directory: collector
        run: python run.py

      - name: Collect player profiles
        working-directory: collector
        run: python players.py

      - name: Collect YouTube streams and videos
        working-directory: collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube.py

      - name: Save database
        if: always() && hashFiles('data/esports.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/esports.db
          key: esports-db-${{ github.run_id }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app
        working-directory: app
        run: npm ci

      - name: Build web app
        working-directory: app
        run: npx expo export --platform web --output-dir ../site

      - name: Publish data
        working-directory: collector
        run: python publish.py --out ../site/api

      - name: Single-page app fallback
        run: |
          cp site/index.html site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's cron is best-effort (on this repo it did not fire for hours), so every run also
  # starts the next one ~25 minutes later. workflow_dispatch from GITHUB_TOKEN is allowed to
  # trigger runs. Stop the chain by setting the repository variable AUTO_LOOP to "off".
  next-run:
    needs: deploy
    if: always() && vars.AUTO_LOOP != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1500
          # skip if another run is already waiting or running (cron or a manual run)
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --json status \
                 --jq '[.[] | select(.status == "queued" or .status == "waiting" or .status == "pending")] | length')
          if [ "$busy" = "0" ]; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "a run is already queued, not starting another"
          fi
